spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:businessverse;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  level:
    com.businessverse: DEBUG
    org.springframework.web: INFO
    org.flywaydb: INFO
